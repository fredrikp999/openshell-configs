# Sandbox policy for Claude Code as an ACP backend for an external Kiro Crew
# (see docs/extras.md#claude-code-as-an-acp-backend-for-an-external-kiro-crew).
#
# Same as vscode-terminal.yaml, plus read access to /Users so the claude-kirocrew-backend
# image's symlink (Kiro Crew's host workspace root -> somewhere under /sandbox,
# see images/claude-kirocrew-backend/Dockerfile) is visible. No write access to
# /Users is needed: once the kernel follows the symlink, writes land under
# /sandbox, already read-write via include_workdir below. Creating /Users itself
# at runtime is never possible under this or any policy -- it needs write access
# to /, the one thing Landlock must never grant -- which is why the symlink has
# to be baked into the image instead.
#
#   bin/sandbox.sh kirocrew-backend       # uses this policy (profiles/kirocrew-backend.env)
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
    - /Users
  read_write:
    - /tmp
    - /dev/null
    - /dev/pts
    - /dev/ptmx
landlock:
  compatibility: best_effort

# To let Claude reach a remote (HTTP) MCP server from this sandbox, uncomment and
# fill in a block like this one per server -- case by case, down to the method
# and tool name. See docs/extras.md#choosing-which-mcp-servers-an-agent-can-reach-case-by-case
# and policies/example.yaml's context7_mcp/huggingface_mcp for the full syntax.
# This does NOT apply to a local (stdio) MCP server such as kirocrew-core/
# kirocrew-cron: those are a child process, not a network connection, so no
# policy rule can reach them -- see the doc section above for why.
#
# network_policies:
#   some_mcp_server:
#     name: some-mcp-server
#     endpoints:
#       - host: mcp.example.com
#         port: 443
#         path: /mcp
#         protocol: mcp
#         enforcement: enforce
#         mcp:
