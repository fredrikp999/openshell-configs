# Sandbox policy for the claude-graphics image (VectorCraft and PhotoCraft): the
# terminal policy (vscode-terminal.yaml) plus read-only access to PyPI and, for
# Replicate, to its output, streaming and docs hosts (see the rules below).
#
# The CLIs and MCP servers (vectorcraft-cli, photocraft-cli) work on local files
# and need no network. The PyPI rule is read-only access for Python and uv
# (below), so the agent can `uv pip install` or `pip install`
# into a virtual environment. Claude Code reaches its API through the attached
# provider, not through this file. The MCP servers are limited to /sandbox by
# their own arguments (images/claude-graphics/claude-start.json).
#
# A GET to PyPI can carry data in its URL, and the setup scripts of an
# installed package run with the agent's rights, so this is less locked down
# than a sandbox without it. The image installs wheels only (no package build
# code runs at install time) and the docs list more ways to lower the risk
# (docs/extras.md, "Installing Python packages"). Remove the pypi rule if the
# task needs no packages.
# Change the rules on a running sandbox with
#   openshell policy set <sandbox> --policy policies/graphics.yaml --wait
#
#   openshell sandbox create --from claude-graphics:latest --policy policies/graphics.yaml ...
#   bin/sandbox.sh graphics       # does the same
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr                     # vectorcraft-cli and photocraft-cli, in /usr/local/bin
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null
    - /dev/pts
    - /dev/ptmx
landlock:
  compatibility: best_effort
network_policies:
  # Python packages: pypi.org for the index, files.pythonhosted.org for the
  # files. pip is a Python script, so the process that connects is python3; uv
  # is its own binary.
  pypi:
    name: pypi
    endpoints:
      - { host: pypi.org, port: 443, protocol: rest, access: read-only, enforcement: enforce }
      - { host: files.pythonhosted.org, port: 443, protocol: rest, access: read-only, enforcement: enforce }
    binaries:
      - path: /usr/bin/python3
      - path: /usr/bin/python3.*
      - path: /usr/local/bin/uv
      - path: /usr/local/bin/uvx
  # Replicate, without the API token (that is added only for the hosts in
  # providers/replicate.yaml). All read-only.
  # Model output (images, video) is downloaded from replicate.delivery and its
  # subdomains.
  replicate-files:
    name: replicate-files
    endpoints:
      - { host: replicate.delivery, port: 443, protocol: rest, access: read-only, enforcement: enforce }
      - { host: "*.replicate.delivery", port: 443, protocol: rest, access: read-only, enforcement: enforce }
    binaries:
      - path: /usr/bin/python3
      - path: /usr/bin/python3.*
      - path: /usr/local/bin/node
  # Output served by the AI gateway: presigned (X-Amz-Signature) links to one
  # Cloudflare R2 bucket, only below /provider-outputs/. The host is
  # ai-gateway-outputs.<account id>.r2.cloudflarestorage.com; the account id may
  # differ, so it is a wildcard. The bucket name is fixed, so other buckets stay
  # closed, and so do other paths.
  replicate-outputs:
    name: replicate-outputs
    endpoints:
      - host: "ai-gateway-outputs.*.r2.cloudflarestorage.com"
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/provider-outputs/**" }
    binaries:
      - path: /usr/bin/python3
      - path: /usr/bin/python3.*
      - path: /usr/local/bin/node
  # Streaming output: the `urls.stream` of a prediction is on stream.replicate.com
  # (server-sent events).
  replicate-stream:
    name: replicate-stream
    endpoints:
      - { host: stream.replicate.com, port: 443, protocol: rest, access: read-only, enforcement: enforce }
      - { host: streaming.api.replicate.com, port: 443, protocol: rest, access: read-only, enforcement: enforce }
    binaries:
      - path: /usr/bin/python3
      - path: /usr/bin/python3.*
      - path: /usr/local/bin/node
  # The docs the Replicate skills point to (https://replicate.com/docs/llms.txt,
  # a model's llms.txt with its schema), for Claude's WebFetch too. Only these
  # paths: the rest of replicate.com (account pages, search) stays closed.
  replicate-docs:
    name: replicate-docs
    endpoints:
      - host: replicate.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/docs/**" }
          - allow: { method: GET, path: "/*/*/llms.txt" }
    binaries:
      - path: /usr/bin/claude
      - path: /usr/local/bin/claude
      - path: /usr/local/lib/node_modules/@anthropic-ai/**
      - path: /usr/bin/python3
      - path: /usr/bin/python3.*
