# Sandbox policy for the agy-python image: Antigravity CLI that can install
# Python packages. It is policies/antigravity.yaml (the four Google hosts, for
# the agy binary only) plus read-only access to PyPI for Python (pip).
#
#   bin/sandbox.sh agy my-task --python
#
# agy's login tokens (including the long-lived refresh token) live in /sandbox
# and are readable by everything in the sandbox, including Python and the
# setup scripts of the packages it installs. A GET to PyPI can carry data in its
# URL, so this sandbox is less locked down than a plain agy one. Use it for work
# that needs pip only, run /logout in agy and delete the sandbox when you are
# done. Change the rules on a running sandbox with
#   openshell policy set <sandbox> --policy policies/agy-python.yaml --wait
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null
    - /dev/pts
    - /dev/ptmx
landlock:
  compatibility: best_effort
network_policies:
  antigravity:
    name: antigravity
    endpoints:
      # Exchanging the login code for tokens, and refreshing the access token.
      # The login page itself (accounts.google.com) opens in your own browser.
      - host: oauth2.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /token
      # agy's eligibility check: your account's email and name.
      - host: www.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /oauth2/v2/userinfo
      # The same check also downloads your account's profile picture.
      - host: lh3.googleusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/a/**"
      # The Code Assist API agy uses for everything else.
      - host: daily-cloudcode-pa.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/v1internal:*"
          - allow:
              method: GET
              path: "/v1internal/**"
    binaries:
      - path: /usr/local/bin/agy

  # Python packages with pip (pypi.org for the index, files.pythonhosted.org
  # for the files). pip is a Python script, so the process that connects is the
  # python3 binary.
  pypi:
    name: pypi
    endpoints:
      - { host: pypi.org, port: 443, protocol: rest, access: read-only, enforcement: enforce }
      - { host: files.pythonhosted.org, port: 443, protocol: rest, access: read-only, enforcement: enforce }
    binaries:
      - path: /usr/bin/python3
      - path: /usr/bin/python3.*
