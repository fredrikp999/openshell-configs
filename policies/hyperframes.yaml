# Sandbox policy for the claude-hyperframes image: the browser policy's
# filesystem rules, plus what HyperFrames compositions and the CLI load.
#
#   openshell sandbox create --from claude-hyperframes:latest --policy policies/hyperframes.yaml ...
#   bin/sandbox.sh claude my-video --hyperframes       # does the same
#
# Compositions load GSAP and other libraries from CDNs and fonts from Google
# Fonts. Headless Chromium (render, check, snapshots, Playwright MCP) loads
# them, and the CLI (node) fetches fonts and registry blocks while compiling.
# Everything is read-only (GET, HEAD, OPTIONS), but a GET can still carry data
# in its URL, so list only hosts you trust with what the agent can see. Pages
# on the sandbox itself (the preview on 127.0.0.1) need no rule.
#
# Find more needed hosts with `openshell logs <sandbox> | grep DENIED`, and
# change the rules on a running sandbox with
#   openshell policy set <sandbox> --policy policies/hyperframes.yaml --wait
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
    - /opt                     # the browser and the HyperFrames skills
  read_write:
    - /tmp
    - /dev/null
    - /dev/pts
    - /dev/ptmx
    - /dev/shm                 # Chromium's shared memory
landlock:
  compatibility: best_effort
network_policies:
  # Libraries and fonts that compositions reference, loaded by Chromium.
  hyperframes_browser:
    name: hyperframes-browser
    endpoints:
      - { host: cdn.jsdelivr.net, port: 443, protocol: rest, access: read-only, enforcement: enforce }
      - { host: unpkg.com, port: 443, protocol: rest, access: read-only, enforcement: enforce }
      - { host: cdnjs.cloudflare.com, port: 443, protocol: rest, access: read-only, enforcement: enforce }
      - { host: fonts.googleapis.com, port: 443, protocol: rest, access: read-only, enforcement: enforce }
      - { host: fonts.gstatic.com, port: 443, protocol: rest, access: read-only, enforcement: enforce }
    binaries:
      - path: /opt/ms-playwright/**

  # The HyperFrames CLI: fonts it embeds while compiling, libraries it checks,
  # and the block registry and docs (`hyperframes add`, `catalog`, `docs`).
  hyperframes_cli:
    name: hyperframes-cli
    endpoints:
      - { host: cdn.jsdelivr.net, port: 443, protocol: rest, access: read-only, enforcement: enforce }
      - { host: fonts.googleapis.com, port: 443, protocol: rest, access: read-only, enforcement: enforce }
      - { host: fonts.gstatic.com, port: 443, protocol: rest, access: read-only, enforcement: enforce }
      - { host: hyperframes.heygen.com, port: 443, protocol: rest, access: read-only, enforcement: enforce }
      # The block registry, only from the HyperFrames repo.
      - host: raw.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/heygen-com/hyperframes/**"
    binaries:
      - path: /usr/local/bin/node
