# Claude Code provider profile using a Claude subscription (Pro/Max) instead
# of an API key. Based on the upstream claude-code.yaml example.
#
# Credential:  a long-lived OAuth token created on the host with
#              `claude setup-token`, stored in CLAUDE_CODE_OAUTH_TOKEN and
#              sent as `Authorization: Bearer <token>` to the endpoints below.
# Binaries:    adjust to the claude path in your image.
# Endpoints:   api.anthropic.com for inference; platform.claude.com is
#              contacted by Claude Code at startup. Nothing else: the token
#              placeholder is resolved for every host listed here, so only
#              Anthropic's own hosts belong in this list. Telemetry hosts
#              (statsig.anthropic.com, sentry.io) are left out on purpose, and
#              the image sets CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 so
#              Claude Code doesn't try to reach them.
#
#   openshell provider profile lint   -f providers/claude-code-oauth.yaml
#   openshell provider profile import -f providers/claude-code-oauth.yaml

id: claude-code-oauth
display_name: Claude Code (subscription)
description: Claude Code CLI authenticated with a Claude subscription OAuth token
category: agent
inference_capable: true
credentials:
  - name: oauth_token
    description: Claude Code OAuth token from `claude setup-token`
    env_vars: [CLAUDE_CODE_OAUTH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [oauth_token]
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: platform.claude.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/bin/claude
  - /usr/local/bin/claude
  - /usr/local/lib/node_modules/@anthropic-ai/**
