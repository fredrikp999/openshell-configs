# Replicate provider profile, used by the claude-graphics sandboxes
# (bin/sandbox.sh claude NAME --graphics).
#
# Credential:  a Replicate API token (replicate.com/account/api-tokens) in
#              REPLICATE_API_TOKEN, sent as `Authorization: Bearer <token>` to
#              the endpoints below. The sandbox only sees a placeholder.
# Binaries:    claude (the Replicate MCP server, mcp.replicate.com) and
#              python3 (the API, for the Replicate skills). Not curl: the image
#              has none.
# Endpoints:   mcp.replicate.com and api.replicate.com only. The placeholder is
#              swapped for the token on every host listed here, so nothing else
#              belongs in this list. replicate.delivery (where model output is
#              downloaded from) is in policies/graphics.yaml instead, without
#              the token.
#
#   openshell provider profile lint   -f providers/replicate.yaml
#   openshell provider profile import -f providers/replicate.yaml

id: replicate
display_name: Replicate
description: Replicate API and MCP server
category: inference
inference_capable: false
credentials:
  - name: api_token
    description: Replicate API token
    env_vars: [REPLICATE_API_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_token]
endpoints:
  - host: mcp.replicate.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: api.replicate.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/bin/claude
  - /usr/local/bin/claude
  - /usr/local/lib/node_modules/@anthropic-ai/**
  - /usr/bin/python3
  - /usr/bin/python3.*
